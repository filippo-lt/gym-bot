services:
  db:
    image: postgres:17
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - gymbot-pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gymbot_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  gymbot-pgdata:
